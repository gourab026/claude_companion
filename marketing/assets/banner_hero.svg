<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlowR" cx="78%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#2a1a50"/>
      <stop offset="100%" stop-color="#0f0d1a"/>
    </radialGradient>
    <radialGradient id="bgGlowL" cx="18%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#1a0f28"/>
      <stop offset="100%" stop-color="#0f0d1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pipBody" cx="35%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#a892ff"/>
      <stop offset="100%" stop-color="#5a48b0"/>
    </radialGradient>
    <radialGradient id="pipGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7860d4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7860d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0f0d1a"/>
  <rect width="1200" height="630" fill="url(#bgGlowR)"/>
  <rect width="1200" height="630" fill="url(#bgGlowL)"/>

  <!-- Subtle grid lines -->
  <g stroke="#7860d4" stroke-width="0.4" opacity="0.06">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="618" width="1200" height="12" fill="#7860d4" opacity="0.6"/>
  <rect x="0" y="618" width="420" height="12" fill="#a892ff" opacity="0.5"/>

  <!-- ── LEFT: Text content ─────────────────────────────── -->

  <!-- Badge -->
  <rect x="64" y="82" width="310" height="34" rx="17" fill="#7860d4" fill-opacity="0.18" stroke="#7860d4" stroke-opacity="0.45" stroke-width="1"/>
  <text x="219" y="104" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700"
        fill="#a892ff" text-anchor="middle" letter-spacing="2">OPEN SOURCE  •  LINUX  •  FREE</text>

  <!-- Main headline -->
  <text x="64" y="186" font-family="Inter, system-ui, sans-serif" font-size="80" font-weight="800"
        fill="#ffffff" letter-spacing="-3">Meet Pip.</text>

  <!-- Sub headline -->
  <text x="64" y="233" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="500"
        fill="#8878a0">Your AI pixel companion for Linux.</text>

  <!-- Divider -->
  <rect x="64" y="258" width="52" height="3" rx="2" fill="#7860d4"/>

  <!-- Feature list -->
  <g font-family="Inter, system-ui, sans-serif" font-size="20" fill="#c8b8e0">
    <!-- Feature 1 -->
    <rect x="64" y="282" width="8" height="8" rx="2" fill="#a892ff"/>
    <text x="84" y="293">AI chat via Claude Code CLI — no API key needed</text>

    <!-- Feature 2 -->
    <rect x="64" y="318" width="8" height="8" rx="2" fill="#60d4a8"/>
    <text x="84" y="329">Dances to your music  •  mini-games  •  Pomodoro</text>

    <!-- Feature 3 -->
    <rect x="64" y="354" width="8" height="8" rx="2" fill="#d46080"/>
    <text x="84" y="365">4 relationship levels — she grows with you</text>

    <!-- Feature 4 -->
    <rect x="64" y="390" width="8" height="8" rx="2" fill="#f0c030"/>
    <text x="84" y="401">Daily word, coding challenges, wellness nudges</text>
  </g>

  <!-- No API key note -->
  <rect x="64" y="430" width="276" height="38" rx="10" fill="#60d4a8" fill-opacity="0.12" stroke="#60d4a8" stroke-opacity="0.4" stroke-width="1"/>
  <text x="202" y="454" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700"
        fill="#60d4a8" text-anchor="middle">No API key required</text>

  <!-- GitHub URL -->
  <text x="64" y="524" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="500"
        fill="#8878a0">github.com/</text>
  <text x="180" y="524" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700"
        fill="#a892ff">gourab026/claude_companion</text>

  <!-- Built with Claude Code -->
  <text x="64" y="556" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400"
        fill="#5a4f70">Built with Claude Code  •  Polyform NC License  •  Python + PyQt6</text>

  <!-- ── RIGHT: Pip character ─────────────────────────── -->

  <!-- Glow ring behind Pip -->
  <ellipse cx="900" cy="330" rx="210" ry="195" fill="url(#pipGlow)"/>
  <ellipse cx="900" cy="330" rx="155" ry="145" fill="#7860d4" fill-opacity="0.08"/>

  <!-- Pip body -->
  <ellipse cx="900" cy="340" rx="168" ry="158" fill="url(#pipBody)"/>

  <!-- Bottom shade -->
  <ellipse cx="900" cy="448" rx="134" ry="60" fill="#4b3caa" opacity="0.90"/>

  <!-- Top highlight -->
  <ellipse cx="828" cy="218" rx="46" ry="26" fill="#d8ccff" opacity="0.28" transform="rotate(-22 828 218)"/>

  <!-- Left eye white -->
  <rect x="794" y="268" width="84" height="92" rx="22" fill="#ffffff"/>
  <!-- Left pupil -->
  <rect x="814" y="290" width="44" height="52" rx="12" fill="#1a1625"/>
  <!-- Left eye shine -->
  <rect x="814" y="290" width="16" height="16" rx="5" fill="#ffffff" opacity="0.60"/>

  <!-- Right eye white -->
  <rect x="922" y="268" width="84" height="92" rx="22" fill="#ffffff"/>
  <!-- Right pupil -->
  <rect x="942" y="290" width="44" height="52" rx="12" fill="#1a1625"/>
  <!-- Right eye shine -->
  <rect x="942" y="290" width="16" height="16" rx="5" fill="#ffffff" opacity="0.60"/>

  <!-- Left cheek -->
  <ellipse cx="816" cy="388" rx="42" ry="24" fill="#d46080" opacity="0.48"/>
  <!-- Right cheek -->
  <ellipse cx="984" cy="388" rx="42" ry="24" fill="#d46080" opacity="0.48"/>

  <!-- Speech bubble above Pip -->
  <rect x="790" y="108" width="220" height="50" rx="14" fill="#ffffff" opacity="0.96"/>
  <polygon points="880,158 900,178 920,158" fill="#ffffff" opacity="0.96"/>
  <text x="900" y="139" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600"
        fill="#1a1625" text-anchor="middle">Hello there!</text>

  <!-- Sparkles around Pip -->
  <g fill="#f0c030">
    <rect x="710" y="168" width="8" height="8" rx="1" opacity="0.9"/>
    <rect x="714" y="152" width="3" height="40" rx="1" opacity="0.9"/>
    <rect x="695" y="172" width="40" height="3" rx="1" opacity="0.9"/>
  </g>
  <g fill="#60d4a8">
    <rect x="1082" y="188" width="7" height="7" rx="1" opacity="0.85"/>
    <rect x="1085" y="173" width="2" height="36" rx="1" opacity="0.85"/>
    <rect x="1068" y="191" width="36" height="2" rx="1" opacity="0.85"/>
  </g>
  <g fill="#a892ff">
    <rect x="694" y="415" width="6" height="6" rx="1" opacity="0.75"/>
    <rect x="697" y="403" width="2" height="30" rx="1" opacity="0.75"/>
    <rect x="683" y="418" width="30" height="2" rx="1" opacity="0.75"/>
  </g>
  <g fill="#f0c030">
    <rect x="1090" y="430" width="7" height="7" rx="1" opacity="0.70"/>
    <rect x="1093" y="417" width="2" height="32" rx="1" opacity="0.70"/>
    <rect x="1078" y="433" width="32" height="2" rx="1" opacity="0.70"/>
  </g>
  <g fill="#d46080">
    <rect x="748" y="500" width="5" height="5" rx="1" opacity="0.65"/>
    <rect x="750" y="491" width="2" height="24" rx="1" opacity="0.65"/>
    <rect x="740" y="502" width="24" height="2" rx="1" opacity="0.65"/>
  </g>
</svg>
