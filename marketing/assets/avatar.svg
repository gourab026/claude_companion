<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#2a1f50"/>
      <stop offset="100%" stop-color="#0f0d1a"/>
    </radialGradient>
    <radialGradient id="bodyGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#a892ff"/>
      <stop offset="100%" stop-color="#5a48b0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGlow)"/>

  <!-- Glow ring behind Pip -->
  <ellipse cx="256" cy="280" rx="170" ry="155" fill="#7860d4" opacity="0.12"/>
  <ellipse cx="256" cy="280" rx="130" ry="118" fill="#7860d4" opacity="0.10"/>

  <!-- Pip body -->
  <ellipse cx="256" cy="290" rx="148" ry="138" fill="url(#bodyGrad)"/>

  <!-- Bottom shade -->
  <ellipse cx="256" cy="388" rx="118" ry="52" fill="#4b3caa" opacity="0.88"/>

  <!-- Top highlight -->
  <ellipse cx="196" cy="185" rx="38" ry="22" fill="#d0c0ff" opacity="0.30" transform="rotate(-25 196 185)"/>

  <!-- Left eye white -->
  <rect x="154" y="228" width="72" height="78" rx="18" fill="#ffffff"/>
  <!-- Left pupil -->
  <rect x="172" y="248" width="36" height="44" rx="10" fill="#1a1625"/>
  <!-- Left eye shine -->
  <rect x="172" y="248" width="14" height="14" rx="4" fill="#ffffff" opacity="0.65"/>

  <!-- Right eye white -->
  <rect x="286" y="228" width="72" height="78" rx="18" fill="#ffffff"/>
  <!-- Right pupil -->
  <rect x="304" y="248" width="36" height="44" rx="10" fill="#1a1625"/>
  <!-- Right eye shine -->
  <rect x="304" y="248" width="14" height="14" rx="4" fill="#ffffff" opacity="0.65"/>

  <!-- Left cheek -->
  <ellipse cx="176" cy="340" rx="36" ry="20" fill="#d46080" opacity="0.45"/>
  <!-- Right cheek -->
  <ellipse cx="336" cy="340" rx="36" ry="20" fill="#d46080" opacity="0.45"/>

  <!-- Sparkles -->
  <g fill="#f0c030" opacity="0.85">
    <rect x="114" y="155" width="6" height="6" rx="1"/>
    <rect x="117" y="143" width="2" height="30" rx="1"/>
    <rect x="104" y="158" width="30" height="2" rx="1"/>
  </g>
  <g fill="#60d4a8" opacity="0.75">
    <rect x="382" y="168" width="5" height="5" rx="1"/>
    <rect x="384" y="157" width="2" height="26" rx="1"/>
    <rect x="372" y="170" width="26" height="2" rx="1"/>
  </g>
  <g fill="#a892ff" opacity="0.70">
    <rect x="95" y="295" width="4" height="4" rx="1"/>
    <rect x="97" y="286" width="2" height="22" rx="1"/>
    <rect x="87" y="297" width="22" height="2" rx="1"/>
  </g>
  <g fill="#f0c030" opacity="0.65">
    <rect x="400" y="310" width="5" height="5" rx="1"/>
    <rect x="402" y="300" width="2" height="24" rx="1"/>
    <rect x="391" y="312" width="24" height="2" rx="1"/>
  </g>

  <!-- "Pip" wordmark at bottom -->
  <text x="256" y="468" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="800"
        fill="#a892ff" text-anchor="middle" letter-spacing="-1">Pip</text>
</svg>
