<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627">
  <defs>
    <radialGradient id="bg1" cx="75%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#1e1540"/>
      <stop offset="100%" stop-color="#0f0d1a"/>
    </radialGradient>
    <radialGradient id="pipB" cx="32%" cy="26%" r="70%">
      <stop offset="0%" stop-color="#b0a0ff"/>
      <stop offset="100%" stop-color="#5040a8"/>
    </radialGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7860d4"/>
      <stop offset="50%" stop-color="#a892ff"/>
      <stop offset="100%" stop-color="#d46080"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="627" fill="#0f0d1a"/>
  <rect width="1200" height="627" fill="url(#bg1)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accentBar)"/>

  <!-- Left panel background card -->
  <rect x="48" y="48" width="580" height="531" rx="20" fill="#1a1625" fill-opacity="0.7" stroke="#7860d4" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Badge row -->
  <rect x="80" y="86" width="100" height="28" rx="14" fill="#7860d4" fill-opacity="0.25" stroke="#7860d4" stroke-opacity="0.5" stroke-width="1"/>
  <text x="130" y="105" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700"
        fill="#a892ff" text-anchor="middle" letter-spacing="1">v1.0.0</text>
  <rect x="196" y="86" width="130" height="28" rx="14" fill="#60d4a8" fill-opacity="0.15" stroke="#60d4a8" stroke-opacity="0.4" stroke-width="1"/>
  <text x="261" y="105" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700"
        fill="#60d4a8" text-anchor="middle" letter-spacing="1">OPEN SOURCE</text>
  <rect x="342" y="86" width="90" height="28" rx="14" fill="#d46080" fill-opacity="0.15" stroke="#d46080" stroke-opacity="0.4" stroke-width="1"/>
  <text x="387" y="105" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700"
        fill="#d46080" text-anchor="middle" letter-spacing="1">LINUX</text>

  <!-- Headline -->
  <text x="80" y="188" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="800"
        fill="#ffffff" letter-spacing="-2">Meet Pip.</text>
  <text x="80" y="230" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="400"
        fill="#8878a0">The AI companion that grows with you.</text>

  <!-- Separator -->
  <rect x="80" y="252" width="440" height="1" fill="#7860d4" fill-opacity="0.3"/>

  <!-- Features -->
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="80" y="270" width="440" height="54" rx="10" fill="#7860d4" fill-opacity="0.10"/>
    <text x="100" y="300" font-size="13" font-weight="700" fill="#a892ff">AI CHAT</text>
    <text x="176" y="300" font-size="13" fill="#8878a0">Claude Code CLI — no API key needed</text>
    <text x="100" y="316" font-size="12" fill="#5a4f70">Web search + your MCP servers included automatically</text>

    <rect x="80" y="334" width="440" height="54" rx="10" fill="#60d4a8" fill-opacity="0.07"/>
    <text x="100" y="364" font-size="13" font-weight="700" fill="#60d4a8">PERSONALITY</text>
    <text x="196" y="364" font-size="13" fill="#8878a0">4 levels — New Friend to Best Friend</text>
    <text x="100" y="380" font-size="12" fill="#5a4f70">Her humour and tone evolve with every conversation</text>

    <rect x="80" y="398" width="440" height="54" rx="10" fill="#d46080" fill-opacity="0.07"/>
    <text x="100" y="428" font-size="13" font-weight="700" fill="#d46080">MUSIC + GAMES</text>
    <text x="214" y="428" font-size="13" fill="#8878a0">Dances to MPRIS  •  Trivia  •  20Q  •  RPS</text>
    <text x="100" y="444" font-size="12" fill="#5a4f70">Pomodoro  •  word of the day  •  coding challenges</text>

    <rect x="80" y="462" width="440" height="54" rx="10" fill="#f0c030" fill-opacity="0.06"/>
    <text x="100" y="492" font-size="13" font-weight="700" fill="#f0c030">FOCUS</text>
    <text x="152" y="492" font-size="13" fill="#8878a0">Pomodoro  •  notes  •  screen-time nudges</text>
    <text x="100" y="508" font-size="12" fill="#5a4f70">Say "remember: X" — she keeps track for you</text>
  </g>

  <!-- GitHub -->
  <text x="80" y="550" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#5a4f70">github.com/</text>
  <text x="178" y="550" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#a892ff">gourab026/claude_companion</text>

  <!-- ── RIGHT: Pip ── -->
  <!-- Glow -->
  <ellipse cx="910" cy="320" rx="200" ry="186" fill="#7860d4" fill-opacity="0.10"/>

  <!-- Body -->
  <ellipse cx="910" cy="330" rx="160" ry="150" fill="url(#pipB)"/>
  <!-- Bottom shade -->
  <ellipse cx="910" cy="432" rx="128" ry="56" fill="#4b3caa" opacity="0.92"/>
  <!-- Highlight -->
  <ellipse cx="842" cy="215" rx="42" ry="24" fill="#ddd0ff" opacity="0.26" transform="rotate(-20 842 215)"/>

  <!-- Eyes -->
  <rect x="808" y="262" width="78" height="86" rx="20" fill="#ffffff"/>
  <rect x="827" y="282" width="40" height="48" rx="10" fill="#1a1625"/>
  <rect x="827" y="282" width="15" height="15" rx="4" fill="#ffffff" opacity="0.55"/>

  <rect x="928" y="262" width="78" height="86" rx="20" fill="#ffffff"/>
  <rect x="947" y="282" width="40" height="48" rx="10" fill="#1a1625"/>
  <rect x="947" y="282" width="15" height="15" rx="4" fill="#ffffff" opacity="0.55"/>

  <!-- Cheeks -->
  <ellipse cx="826" cy="378" rx="38" ry="22" fill="#d46080" opacity="0.44"/>
  <ellipse cx="994" cy="378" rx="38" ry="22" fill="#d46080" opacity="0.44"/>

  <!-- Speech bubble -->
  <rect x="798" y="108" width="224" height="48" rx="14" fill="#ffffff" opacity="0.95"/>
  <polygon points="880,156 900,173 920,156" fill="#ffffff" opacity="0.95"/>
  <text x="910" y="137" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="600"
        fill="#1a1625" text-anchor="middle">No API key needed!</text>

  <!-- Sparkles -->
  <g fill="#f0c030" opacity="0.88">
    <rect x="718" y="172" width="8" height="8" rx="1"/>
    <rect x="722" y="157" width="3" height="38" rx="1"/>
    <rect x="704" y="176" width="38" height="3" rx="1"/>
  </g>
  <g fill="#60d4a8" opacity="0.80">
    <rect x="1082" y="200" width="7" height="7" rx="1"/>
    <rect x="1085" y="186" width="2" height="34" rx="1"/>
    <rect x="1070" y="203" width="34" height="2" rx="1"/>
  </g>
  <g fill="#a892ff" opacity="0.70">
    <rect x="706" y="430" width="6" height="6" rx="1"/>
    <rect x="709" y="419" width="2" height="28" rx="1"/>
    <rect x="697" y="433" width="28" height="2" rx="1"/>
  </g>
  <g fill="#f0c030" opacity="0.65">
    <rect x="1086" y="435" width="6" height="6" rx="1"/>
    <rect x="1089" y="424" width="2" height="28" rx="1"/>
    <rect x="1077" y="438" width="28" height="2" rx="1"/>
  </g>
</svg>
